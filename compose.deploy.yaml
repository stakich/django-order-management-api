services:
  postgres:
    ports: !reset []

  web:
    ports: !reset []
    environment:
      DJANGO_DEBUG: "False"
    volumes:
      - product_media:/app/media

  scheduler:
    environment:
      DJANGO_DEBUG: "False"

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./deploy/nginx/deploy.conf:/etc/nginx/conf.d/default.conf:ro
      - product_media:/var/www/media:ro
    depends_on:
      - web

volumes:
  product_media: